name: vire
description: Vire - aplikasi manajemen pengeluaran perusahaan (Owner & Employee).
publish_to: "none"
version: 1.0.0+1
 
environment:
  sdk: ">=3.4.0 <4.0.0"
 
dependencies:
  flutter:
    sdk: flutter

  go_router: ^14.0.0         
  flutter_riverpod: ^2.5.1      
 
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  dio: ^5.4.0                   
  flutter_secure_storage: ^9.0.0 

  fl_chart: ^0.68.0            
  flutter_svg: ^2.0.10          
  intl: ^0.19.0                 

  mobile_scanner: ^5.1.1        
  qr_flutter: ^4.1.0            

  image_picker: ^1.1.2         
  image: ^4.10.1
  pdf: ^3.11.0
  csv: ^6.0.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  file_picker: ^8.0.7
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  google_sign_in_platform_interface: ^3.1.0
 
flutter:
  uses-material-design: true
 
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/Regular Images/
    - assets/images/Logo Bank/
    - assets/images/Logo E-Wallet/
    - assets/images/Profiles/
  fonts:
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-Light.ttf
          weight: 300
        - asset: assets/fonts/InterTight-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTight-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterTight-Bold.ttf
          weight: 700
